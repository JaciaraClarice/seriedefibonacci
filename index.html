<html>
<head>
    <meta charset="UTF-8">
    <title>Série de Fibonacci</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">Série de Fibonacci</h1>

        <div class="card p-4 shadow">

            <form onsubmit="executar(); return false;">

                <div class="mb-3">
                    <label class="form-label">Valor de X</label>
                    <input type="number" id="v1" class="form-control"/>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Executar
                </button>

            </form>

            <div id="resp" class="alert alert-info mt-3">
                O resultado aparece aqui
            </div>

        </div>
    </div>

    <script src="EstruturasDeRepeticao.js"></script>

    <script>
        const executar = () => {
            const x = Number(document.getElementById("v1").value);

            let serie = "", i = 0;

            while (i <= x) {
                serie += fibonacci(i) + " ";
                i++;
            }

            document.getElementById("resp").innerHTML = `Resultado: ${serie}`;
        }
    </script>

</body>
</html>
